<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BigDog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<header class="hero">
  <div class="bg"></div><div class="bg-tone"></div><div class="bg-fade"></div>

  <nav class="navbar navbar-expand-sm px-3 px-md-5" aria-label="Main">
    <a class="navbar-brand" href="#"><span class="mark" role="img" aria-label="BigDog"></span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="mainNav">
      <ul class="navbar-nav gap-sm-4">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Shop</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#hoodies" data-open="hoodies">Hoodies</a></li>
            <li><a class="dropdown-item" href="#sweaters" data-soon="Sweaters">Sweaters</a></li>
            <li><a class="dropdown-item" href="#t-shirts" data-soon="T-shirts">T-shirts</a></li>
            <li><a class="dropdown-item" href="#pants" data-soon="Pants and sweatpants">Pants and sweatpants</a></li>
            <li><a class="dropdown-item" href="#caps" data-soon="Caps">Caps</a></li>
          </ul>
        </li>
        <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
        <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main class="hero-main">
    <h1 class="visually-hidden">BigDog</h1>
    <div class="logo" role="img" aria-label="BigDog logo"><i></i></div>
    <div class="below">
      <p class="tag">Clothing for the ones who lead the pack.</p>
      <a class="btn btn-emerald" href="#hoodies" data-open="hoodies">Shop the collection</a>
    </div>
  </main>
</header>

<section class="hoodies" id="hoodies">
  <div class="container">
    <button class="acc-btn" type="button" data-bs-toggle="collapse" data-bs-target="#hoodie-list" aria-expanded="false" aria-controls="hoodie-list">Hoodies</button>
    <div class="collapse" id="hoodie-list">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4 pb-5">
        <div class="col"><img src="images/hoodie-1.jpg" alt="Two people in heather gray BigDog hoodies against a concrete wall, one showing the BDG chest print and one the vertical BIGDOG back print" loading="lazy"><h2>Hoodie 1</h2></div>
        <div class="col"><img src="images/hoodie-2.jpg" alt="One person in a sky blue BDG hoodie and one in a sage green hoodie with the BigDog dog graphic on the back" loading="lazy"><h2>Hoodie 2</h2></div>
        <div class="col"><img src="images/hoodie-3.jpg" alt="Three people in a gray BIGDOG hoodie, a sky blue BDG hoodie and a mustard BDG hoodie" loading="lazy"><h2>Hoodie 3</h2></div>
        <div class="col"><img src="images/hoodie-4.jpg" alt="Back of a sky blue hoodie with BIGDOG printed vertically" loading="lazy"><h2>Hoodie 4</h2></div>
      </div>
    </div>
  </div>
</section>

<section class="contact" id="contact">
  <div class="container">
    <h2>Contact</h2>
    <p class="who">Tyrese</p>
    <a class="tel" href="tel:+27796315624">079 631 5624</a>
    <div>
      <a class="ig" href="https://www.instagram.com/BigDog_essentials" target="_blank" rel="noopener noreferrer" aria-label="BigDog on Instagram, @BigDog_essentials">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/></svg>
        <span>@BigDog_essentials</span>
      </a>
    </div>
  </div>
</section>

<div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3 soon-wrap">
  <div id="soon-toast" class="toast soon" role="status" aria-live="polite" aria-atomic="true" data-bs-delay="2800">
    <div class="toast-body text-center"><b>Coming soon</b><span id="toast-name"></span></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
